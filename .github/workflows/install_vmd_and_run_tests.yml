name: VMD installation and tcl testing

on:
  push:
    branches:
      - '**'

jobs:
  build-vmd:
    runs-on: ubuntu-latest
    env:
        VMDINSTALLBINDIR: "${{ github.workspace }}/.cache/vmd-install/bin"
        VMDINSTALLLIBRARYDIR: "${{ github.workspace }}/.cache/vmd-install/lib"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libx11-dev \
            libglu1-mesa-dev \
            libxi-dev \
            libxext-dev \
            libxmu-dev \
            libjpeg-dev \
            libpng-dev \
            tcl-dev \
            tk-dev \
            python3-dev \
            flex \
            bison \
            git

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib
          pip install pytest
          pip install ./python/

      - name: Set up VMD
        id: setup-vmd
        uses: BranniganLab/setup-vmd@ae464c279176585de8a94bd7c7bd11eee4da5783
        with:
          github-app-id: ${{ secrets.GH_APP_ID }}
          github-app-private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Report VMD cache status
        run: |
          echo "VMD cache hit: ${{ steps.setup-vmd.outputs.cache-hit }}"

      # Step 8: Generate new values for acceptance testing
      - name: Generate new values for acceptance testing
        run: |
          cd $GITHUB_WORKSPACE/test_files/
          echo "Running polarDensityBin.tcl on test systems in preparation for acceptance testing."
          vmd -dispdev none -e ./run_dta_for_regr_test.tcl 2>&1 | tee ./run_dta_for_regr_test.log
          if grep -q -e "can't" -e "couldn't" -e "must have a count of at least 1" -e "failed" ./run_dta_for_regr_test.log
          then
            echo "An error occurred when running polarDensityBin.tcl on the test systems"
            exit 1
          fi

      # Step 9: Acceptance testing
      - name: Acceptance testing
        run: |
          cd $GITHUB_WORKSPACE/test_files/
          echo "Acceptance testing start"
          python3 -m pytest ./tcl_regr_test.py
