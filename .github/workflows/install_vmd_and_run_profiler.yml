name: VMD installation and Tcl profiling

on:
  workflow_dispatch:

jobs:
  profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libx11-dev \
            libglu1-mesa-dev \
            libxi-dev \
            libxext-dev \
            libxmu-dev \
            libjpeg-dev \
            libpng-dev \
            tcl-dev \
            tk-dev \
            python3-dev \
            flex \
            bison \
            git

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy matplotlib pytest
          python -m pip install ./python/

      - name: Set up VMD
        id: setup-vmd
        uses: BranniganLab/setup-vmd@main
        with:
          github-app-id: ${{ secrets.GH_APP_ID }}
          github-app-private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Report VMD cache status
        run: |
          echo "VMD cache hit: ${{ steps.setup-vmd.outputs.cache-hit }}"

      - name: Profile code and generate report
        id: profiler
        uses: BranniganLab/vmd-time-profiler@main
        with:
          script: test_files/benchmark/run_benchmark.tcl
          repetitions: 10
          warmup-runs: 1
          output: timing_results

      - name: Upload timing results
        uses: actions/upload-artifact@v6
        with:
          name: vmd-timing-results
          path: |
            ${{ steps.profiler.outputs.csv-file }}
            ${{ steps.profiler.outputs.txt-file }}
          if-no-files-found: error
          retention-days: 30
